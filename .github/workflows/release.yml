name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Tag matches pubspec.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version="v$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml ($version)"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  windows:
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: choco install innosetup --no-progress -y
      - run: .\tool\build_installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/DevKit-Setup.exe
          if-no-files-found: error

  macos:
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        # The scrcpy and adb inside the app only run on the architecture they were built on.
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: |
          sh tool/build_macos.sh
          mv dist/FlutterDevKit.dmg "dist/FlutterDevKit-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/FlutterDevKit-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
